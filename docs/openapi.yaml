openapi: "3.0.3"
info:
  title: "Personal Finance Tracker API"
  version: "1.0.0"
  description: "Aplikasi pencatatan keuangan pribadi — Backend API"
  contact:
    name: Developer
    email: admin@example.com
  license:
    name: Private
servers:
  - url: http://localhost:8080/api/v1
    description: Development server
  - url: https://api.finance.example.com/api/v1
    description: Production server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Masukkan token JWT dengan format: Bearer <access_token>

  schemas:
    AIConsent:
      type: object
      properties:
        enabled: { type: boolean }
        consent_at: { type: string, format: date-time, nullable: true }
        can_manage: { type: boolean }
        available: { type: boolean }
    AIInsightResponse:
      type: object
      properties:
        status: { type: string, enum: [not_available, pending, processing, completed, failed] }
        period: { type: string, example: "2026-07" }
        facts: { type: object, additionalProperties: true }
        analysis: { type: object, nullable: true, additionalProperties: true }
        generated_at: { type: string, format: date-time, nullable: true }
        model: { type: string }
        is_stale: { type: boolean }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: mypassword123
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: Refresh token yang diperoleh saat login
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [income, expense]
        icon:
          type: string
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
    CreateCategoryRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          example: Makanan
        type:
          type: string
          enum: [income, expense]
          example: expense
        icon:
          type: string
          example: food
    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [income, expense]
        amount:
          type: number
          format: double
          minimum: 0.01
        transaction_date:
          type: string
          format: date
        note:
          type: string
        category_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateTransactionRequest:
      type: object
      required: [type, amount, category_id, transaction_date]
      properties:
        category_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [income, expense]
        amount:
          type: number
          format: double
          minimum: 0.01
          example: 50000
        transaction_date:
          type: string
          format: date
          example: "2026-06-19"
        note:
          type: string
    UpdateTransactionRequest:
      type: object
      required: [type, amount, category_id, transaction_date]
      properties:
        category_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [income, expense]
        amount:
          type: number
          format: double
          minimum: 0.01
        transaction_date:
          type: string
          format: date
        note:
          type: string
    BalanceResponse:
      type: object
      properties:
        balance:
          type: number
          format: double
          description: Saldo berjalan (total income - total expense)
    ReportRow:
      type: object
      properties:
        period:
          type: string
          format: date
          description: Periode laporan
        total_income:
          type: number
          format: double
        total_expense:
          type: number
          format: double
    ReportResponse:
      type: object
      properties:
        periods:
          type: array
          items:
            $ref: '#/components/schemas/ReportRow'
        total_income:
          type: number
          format: double
        total_expense:
          type: number
          format: double
        net:
          type: number
          format: double
          description: total_income - total_expense
    Error:
      type: object
      properties:
        error:
          type: string

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login user
      description: Autentikasi user dengan email dan password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "401":
          description: Email atau password salah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: Mendapatkan access token baru menggunakan refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        "200":
          description: Token berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "401":
          description: Refresh token tidak valid atau kadaluarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout user
      description: Menghapus sesi user (invalidasi refresh token)
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        "200":
          description: Logout berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: logged out successfully
        "400":
          description: Gagal logout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /categories:
    get:
      tags: [Categories]
      summary: Daftar kategori
      description: Mendapatkan daftar kategori transaksi milik user yang login
      operationId: listCategories
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [income, expense]
          description: Filter berdasarkan tipe
      responses:
        "200":
          description: Daftar kategori
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
        "401":
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /summary/ai-insights:
    get:
      tags: [AI Insights]
      summary: Insight AI untuk bulan tertentu
      security: [{ BearerAuth: [] }]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: '^\\d{4}-\\d{2}$' }
      responses:
        "200":
          description: Status atau hasil insight
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIInsightResponse' }

  /summary/ai-insights/latest:
    get:
      tags: [AI Insights]
      summary: Insight AI terbaru untuk dashboard
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Status atau hasil insight terbaru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIInsightResponse' }

  /groups/{id}/ai-consent:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [AI Insights]
      summary: Status consent AI kelompok
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Status consent dan hak pengelolaan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIConsent' }
    put:
      tags: [AI Insights]
      summary: Ubah consent AI kelompok
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Consent diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIConsent' }
        "403":
          description: Hanya owner yang dapat mengubah consent
    post:
      tags: [Categories]
      summary: Buat kategori baru
      description: Membuat kategori transaksi custom
      operationId: createCategory
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        "201":
          description: Kategori berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        "400":
          description: Data tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /transactions:
    get:
      tags: [Transactions]
      summary: Daftar transaksi
      description: Mendapatkan daftar transaksi dengan filter dan pagination
      operationId: listTransactions
      security:
        - BearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter tanggal awal (YYYY-MM-DD)
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter tanggal akhir (YYYY-MM-DD)
        - name: category_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter berdasarkan kategori
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [income, expense]
          description: Filter berdasarkan tipe
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Halaman
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Item per halaman
      responses:
        "200":
          description: Daftar transaksi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
        "400":
          description: Parameter tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Transactions]
      summary: Buat transaksi baru
      description: Mencatat transaksi income atau expense baru
      operationId: createTransaction
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        "201":
          description: Transaksi berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        "400":
          description: Data tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /transactions/{id}:
    get:
      tags: [Transactions]
      summary: Detail transaksi
      description: Mendapatkan detail transaksi berdasarkan ID
      operationId: getTransactionById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID Transaksi
      responses:
        "200":
          description: Detail transaksi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        "404":
          description: Transaksi tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Transactions]
      summary: Update transaksi
      description: Memperbarui data transaksi berdasarkan ID
      operationId: updateTransaction
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID Transaksi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionRequest'
      responses:
        "200":
          description: Transaksi berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        "400":
          description: Data tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Transactions]
      summary: Hapus transaksi
      description: Menghapus transaksi berdasarkan ID (soft delete)
      operationId: deleteTransaction
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID Transaksi
      responses:
        "200":
          description: Transaksi berhasil dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: transaction deleted successfully
        "404":
          description: Transaksi tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /summary/balance:
    get:
      tags: [Summary]
      summary: Saldo berjalan
      description: Mendapatkan saldo terkini (running balance) = total income - total expense
      operationId: getBalance
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Saldo berjalan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        "500":
          description: Gagal mendapatkan saldo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /summary/report:
    get:
      tags: [Summary]
      summary: Laporan keuangan
      description: Mendapatkan ringkasan income vs expense per periode
      operationId: getReport
      security:
        - BearerAuth: []
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [daily, weekly, monthly]
            default: monthly
          description: Periode laporan
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Tanggal awal (YYYY-MM-DD)
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Tanggal akhir (YYYY-MM-DD)
      responses:
        "200":
          description: Laporan keuangan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        "400":
          description: Parameter tidak lengkap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
