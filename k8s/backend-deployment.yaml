apiVersion: v1
kind: Service
metadata:
  name: finance-api
  namespace: finance-tracker
  labels:
    app.kubernetes.io/name: finance-api
    app.kubernetes.io/part-of: personal-finance-tracker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: finance-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-api
  namespace: finance-tracker
  labels:
    app.kubernetes.io/name: finance-api
    app.kubernetes.io/part-of: personal-finance-tracker
spec:
  # PENTING — jangan naikkan tanpa membaca ini dulu.
  # Server menjalankan RunMigrations() + SeedAdmin() setiap kali start, dan
  # tidak ada tabel versi migrasi maupun advisory lock. Dua pod yang start
  # bersamaan akan menjalankan DDL yang sama secara paralel. Untuk scale > 1,
  # pindahkan migrasi ke Job/initContainer terlebih dulu dan tambahkan
  # pg_advisory_lock di RunMigrations().
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: finance-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finance-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Ganti ke registry dan tag yang sebenarnya. Hindari :latest —
          # tag immutable membuat rollback bisa diprediksi.
          image: personal-finance-tracker-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          # /health hanya menjawab "ok" (liveness murni, tidak menyentuh DB).
          # /ready melakukan ping ke database — dipakai sebagai readiness.
          startupProbe:
            httpGet:
              path: /health
              port: http
            # Toleransi sampai 60 detik untuk migrasi saat start pertama.
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi

      # Server sudah menangani SIGTERM dengan app.Shutdown() (graceful).
      terminationGracePeriodSeconds: 30
