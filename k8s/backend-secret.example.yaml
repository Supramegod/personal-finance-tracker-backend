# TEMPLATE — JANGAN isi nilai asli di file ini dan jangan commit versi terisinya.
# Salin jadi backend-secret.yaml (sudah masuk .gitignore), isi nilainya, lalu apply.
#
# Cara lebih aman tanpa menulis file sama sekali:
#
#   kubectl -n finance-tracker create secret generic backend-secret \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=ADMIN_EMAIL="admin@example.com" \
#     --from-literal=ADMIN_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=DATABASE_URL="postgresql://finance:PASSWORD@postgres:5432/finance_tracker?sslmode=disable"
#
# Catatan: Secret bawaan Kubernetes hanya base64, BUKAN terenkripsi. Untuk
# produksi pakai Sealed Secrets / External Secrets Operator / SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: finance-tracker
  labels:
    app.kubernetes.io/name: finance-api
    app.kubernetes.io/part-of: personal-finance-tracker
type: Opaque
stringData:
  # WAJIB minimal 32 karakter acak. Kalau kosong, aplikasi log.Fatal saat start.
  JWT_SECRET: "GANTI-dengan-hasil-openssl-rand-base64-48"

  # Dipakai sekali saat seed user admin pertama. Ganti passwordnya setelah login.
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_PASSWORD: "GANTI-password-admin"

  # Host "postgres" merujuk ke Service PostgreSQL di namespace yang sama.
  # sslmode=require kalau memakai managed database (Neon/Supabase/RDS).
  DATABASE_URL: "postgresql://finance:GANTI-password-db@postgres:5432/finance_tracker?sslmode=disable"

  # Buat di Google AI Studio. Jangan pernah commit nilai aslinya.
  GEMINI_API_KEY: "GANTI-dengan-api-key-gemini"
---
# Kredensial untuk StatefulSet PostgreSQL. Password di sini HARUS sama dengan
# yang dipakai di DATABASE_URL milik backend-secret di atas.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: finance-tracker
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: personal-finance-tracker
type: Opaque
stringData:
  POSTGRES_USER: "finance"
  POSTGRES_PASSWORD: "GANTI-password-db"
  POSTGRES_DB: "finance_tracker"
