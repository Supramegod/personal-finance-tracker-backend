# Ingress untuk API. Asumsi cluster memakai ingress-nginx + cert-manager.
# Kalau memakai controller lain (Traefik, HAProxy), sesuaikan
# ingressClassName dan anotasinya.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finance-api
  namespace: finance-tracker
  labels:
    app.kubernetes.io/name: finance-api
    app.kubernetes.io/part-of: personal-finance-tracker
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Data finansial — paksa HTTPS, jangan sampai token lewat plain HTTP.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.finance.example.com
      secretName: finance-api-tls
  rules:
    - host: api.finance.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finance-api
                port:
                  name: http
