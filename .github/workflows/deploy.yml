# Alur: push ke main -> test -> build image -> push ke GitHub Container
# Registry (GHCR). Berhenti di situ.
#
# TIDAK ada deploy otomatis: server adalah PC rumah di belakang CGNAT yang
# tidak bisa di-SSH dari luar. Server menarik image dari GHCR dan menjalankan
# Docker sendiri (lihat DEPLOY.md). Pipeline ini hanya menyediakan image baru.
#
# Tidak ada secret yang perlu didaftarkan — GITHUB_TOKEN dibuat otomatis dan
# sudah cukup untuk push ke GHCR (asal Workflow permissions = Read and write).

name: Build & Push

on:
  push:
    branches: [main]
  workflow_dispatch: # tombol "Run workflow" manual di tab Actions

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - run: go build ./...
      - run: go vet ./...
      # Hanya test yang tidak butuh PostgreSQL. Test service/integration
      # perlu database dan tidak dijalankan di sini.
      - run: go test ./pkg/... -count=1 -short

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # izin push ke ghcr.io
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # GHCR menolak nama repository yang mengandung huruf kapital, sedangkan
      # github.repository mempertahankan kapitalisasi asli ("Supramegod/...").
      # Tanpa langkah ini, docker pull gagal: "repository name must be lowercase".
      - id: ref
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lc=$REPO_LC" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/$REPO_LC:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # WAJIB — tanpa ini buildx memakai driver "docker" bawaan yang TIDAK
      # mendukung cache export ("Cache export is not supported for the docker
      # driver"). Langkah ini membuat builder driver "docker-container" yang
      # mendukung cache-to registry maupun gha.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Dua tag: SHA commit (immutable, untuk rollback) dan latest.
          tags: |
            ${{ steps.ref.outputs.image }}
            ${{ env.REGISTRY }}/${{ steps.ref.outputs.repo_lc }}:latest
          # Cache disimpan sebagai tag terpisah di GHCR, bukan type=gha.
          # type=gha butuh akses Actions Cache API (scope actions:write) yang
          # tidak dimiliki job ini; kegagalan cache-export-nya mematikan build.
          # Registry-cache memakai izin packages:write yang sudah ada.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.ref.outputs.repo_lc }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.ref.outputs.repo_lc }}:buildcache,mode=max

# Tidak ada job "deploy" otomatis. Server (PC rumah) menarik image dan
# menjalankan Docker secara manual di direktori yang sudah disiapkan —
# lihat DEPLOY.md. Pipeline ini berhenti setelah image masuk ke GHCR.
