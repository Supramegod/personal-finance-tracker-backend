# docker-compose.prod.yml — dipakai DI PC yang jadi server (di rumah, di
# belakang CGNAT/IndiHome). Akses publik lewat Cloudflare Tunnel, bukan
# membuka port — jadi tidak butuh IP publik maupun port forwarding.
#
# Cara pakai (dijalankan otomatis oleh self-hosted GitHub runner, atau manual):
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

services:
  db:
    image: postgres:16-alpine
    container_name: finance-db
    restart: unless-stopped
    # Tanpa "ports:" — database tidak pernah terekspos ke host maupun internet.
    # Container lain menghubunginya lewat nama host "db" di network compose.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    # Tag di-set oleh GitHub Actions saat deploy (variabel API_IMAGE).
    image: ${API_IMAGE:-ghcr.io/supramegod/personal-finance-tracker-backend:latest}
    container_name: finance-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Tanpa "ports:" — API hanya dijangkau dari dalam network compose,
    # baik oleh cloudflared (trafik publik) maupun healthcheck deploy.
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: finance-tunnel
    restart: unless-stopped
    depends_on:
      - api
    # Tunnel "remotely-managed": pemetaan hostname -> http://api:8080 diatur
    # di dashboard Cloudflare Zero Trust, bukan di file ini. cloudflared cukup
    # butuh token tunnel-nya. Koneksi HANYA keluar ke Cloudflare, jadi tembus
    # CGNAT tanpa buka port apa pun.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}

volumes:
  pgdata:
